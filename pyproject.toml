[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2,<3" ]

[project]
name = "dota-picker"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
  { name = "Oleksii Kutsenko", email = "kutsenko.new@gmail.com" },
]
requires-python = "<3.14,>=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "click>=8.3,<9",
  "optuna==4.8",
  "optuna-dashboard==0.20",
  "pandas>=2.3.3,<3",
  "plotly>=6.3.1,<7",
  "requests==2.34.2",
  "scikit-learn>=1.7.2,<2",
  "streamlit==1.62",
  "torch==2.13",
  "torchmetrics>=1.9,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2,<2",
  "pandas-stubs>=2.3.2.250926,<3",
  "pylint>=3.3.8,<4",
  "ruff>=0.13.2,<0.14",
  "scipy-stubs>=1.18.1,<2",
  "types-requests>=2.32.4.20250913,<3",
]

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py312"
line-length = 79
indent-width = 4
exclude = [ ".venv", "venv", "version1" ]
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "ANN001",
  "ANN201",
  "ANN401",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107",
  "D203",
  "D205",
  "D212",
  "G004",
  "S101",
]
